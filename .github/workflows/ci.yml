name: Build

on:
  push:
    branches:
      - master
      - '1.12.x'
      - '1.12.*'
      - '1.13.*'
      - '1.14.*'
      - '1.15.*'
      - '1.16.*'
      - '1.17.*'
      - '1.18.*'
      - '1.19.*'
      - '1.20.*'
      - '1.21.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify persistence regression guard
        shell: pwsh
        run: ./tools/verify-persistence.ps1

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dwurdy-sharks-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
